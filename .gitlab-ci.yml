stages : 
  - notify 
  # - install-dependencies # if you do lint , test files on local use it here 
  # - lint
  # - test
  - build-docker-images
  - deploy

variables:
  PLACEHOLDER_DIRECTORY: placeholder
  FRONT_SERVICE_TAG_LATEST: $DOCKERHUB_USERNAME/react-service:latest
  BACK_SERVICE_TAG_LATEST: $DOCKERHUB_USERNAME/flask-service:latest
  PLACEHOLDER_LATEST: placeholder
  REACT_APP_API_URL_ARG: "" # NOT AFFECT THE BUILD OF FLASK






slack_pipeline_start:
  stage: notify
  image: curlimages/curl:latest
  script:
    - >
      curl -X POST -H "Content-type: application/json" --data "{
        \"text\": \"👋 Hello team! Pipeline *#${CI_PIPELINE_ID}* just started on branch *${CI_COMMIT_REF_NAME}*! 🛠️\n\n🥁 *Drum rolls...* Get ready for action! 💪\n\n🎉 Let's hope this one doesn't break prod 😅\n\n🔗 <${CI_PIPELINE_URL}|Click here to watch the show!>\"
      }" $SLACK_WEBHOOK_URL



# want cache if you will do lint ,test to preserve the dependencies not install each time also cache ansible in last job not every deployment install it again 
# cache:
#   key: ${CI_COMMIT_REF_SLUG}
#   paths:
#     - ./frontend/node_modules
#     - ./backend/youssef/venv
# needed cache if you will do lint ,test to preserve the dependencies not install each time 





.dockerize_template:
  stage: build-docker-images
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"
  script:
    - cd $PLACEHOLDER_DIRECTORY
    - docker build -t ${REACT_APP_API_URL_ARG}  app:v1 .
    - docker tag app:v1 $PLACEHOLDER_LATEST
    - docker push $PLACEHOLDER_LATEST

dockarize-react:
  extends: .dockerize_template
  variables:
    PLACEHOLDER_DIRECTORY: frontend
    PLACEHOLDER_LATEST: $FRONT_SERVICE_TAG_LATEST
    REACT_APP_API_URL_ARG: --build-arg REACT_APP_API_URL=http://$EC2_HOST/api   # this replace http//localhost:3000/api in front 
  needs:
    - slack_pipeline_start

dockarize-flask:
  extends: .dockerize_template
  variables:
    PLACEHOLDER_DIRECTORY: backend
    PLACEHOLDER_LATEST: $BACK_SERVICE_TAG_LATEST
  needs:
    - slack_pipeline_start







