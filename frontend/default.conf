 upstream flask_api { # we define an upstream block to group one or more backend servers (fastapi app) that nginx will proxy requests to and also to make it easier to manage and load balance between multiple backend servers if needed
        #here will replace fastapi that is name of service in compose the dns will resolve it to the correct ip address of the container running fastapi to its internal port 5000
        server backend:5000;  # internal Docker service name + port
        server backend2:5000; # this another diff container on same port no problem 
        server backend3:5000;
        # server fastapi:5001;  # if you have multiple instances of FastAPI nginx will load balancing
    }

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
                            # backend name of the service in docker compose will resolve to ip of the contianer : 5000 internal port inside container 
        proxy_pass http://flask_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host; # here he keeps the host that clinet sent to nginx and forward it to backend like (proxy_server_name) he sends that host name to the backend server and backend can use that host name to generate correct urls in response #here that name is localhost but in production it will be your domain name and backend can use that domain name to generate correct urls in response
        proxy_cache_bypass $http_upgrade;
    }
}